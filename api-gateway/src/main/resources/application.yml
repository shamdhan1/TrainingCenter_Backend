server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - name: AuthenticationFilter
      routes:
        # Auth Service Route (Login/Register are open — filter skips them)
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**

        # Admin Service Routes
        - id: admin-centers
          uri: lb://ADMIN-SERVICE
          predicates:
            - Path=/api/v1/centers/**

        - id: admin-courses
          uri: lb://ADMIN-SERVICE
          predicates:
            - Path=/api/v1/courses/**

        - id: admin-batches
          uri: lb://ADMIN-SERVICE
          predicates:
            - Path=/api/v1/batches/**

        - id: admin-dashboard
          uri: lb://ADMIN-SERVICE
          predicates:
            - Path=/api/v1/dashboard/**

        # Trainer Service Routes
        - id: trainer-service
          uri: lb://TRAINER-SERVICE
          predicates:
            - Path=/api/v1/trainers/**

        - id: trainer-reports
          uri: lb://TRAINER-SERVICE
          predicates:
            - Path=/api/v1/trainer-reports/**

        # Student Service Routes
        - id: student-service
          uri: lb://STUDENT-SERVICE
          predicates:
            - Path=/api/v1/students/**

        - id: student-admissions
          uri: lb://STUDENT-SERVICE
          predicates:
            - Path=/api/v1/admissions/**

        - id: student-enrollments
          uri: lb://STUDENT-SERVICE
          predicates:
            - Path=/api/v1/enrollments/**

        - id: student-fees
          uri: lb://STUDENT-SERVICE
          predicates:
            - Path=/api/v1/fees/**

        - id: student-payments
          uri: lb://STUDENT-SERVICE
          predicates:
            - Path=/api/v1/payments/**

        - id: student-attendance
          uri: lb://STUDENT-SERVICE
          predicates:
            - Path=/api/v1/attendance/**

        - id: student-assessments
          uri: lb://STUDENT-SERVICE
          predicates:
            - Path=/api/v1/assessments/**

        - id: student-progress
          uri: lb://STUDENT-SERVICE
          predicates:
            - Path=/api/v1/student-progress/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            exposedHeaders:
              - "Authorization"
              - "Content-Type"
            allowCredentials: true
            maxAge: 3600

      httpclient:
        connect-timeout: 5000
        response-timeout: 30s

# JWT Configuration (same secret shared with auth-service)
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: API Gateway
    description: Spring Cloud Gateway - Entry Point for Training Center Microservices
    version: 1.0.0

logging:
  level:
    org.springframework.cloud.gateway: WARN
    com.trainingcenter.gateway: INFO
